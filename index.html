<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世の中に綿パンが少なくて困る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ee;
    --fg: #1a1814;
    --muted: #8a8680;
    --accent: #2a2724;
    --line: #d8d4cc;
    --hover-bg: #ede9e2;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .container {
    width: 100%;
    max-width: 420px;
  }

  /* ヘッダー */
  .header {
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }

  .site-name {
    font-size: clamp(13px, 3.5vw, 15px);
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.65;
    color: var(--fg);
    margin-bottom: 10px;
  }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.18em;
    font-family: 'DM Mono', monospace;
    font-weight: 300;
  }

  /* 区切り線 */
  .divider {
    width: 24px;
    height: 1px;
    background: var(--line);
    margin: 20px 0;
  }

  /* リンクリスト */
  .links {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .links li {
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }
  .links li:nth-child(1) { animation-delay: 0.15s; }
  .links li:nth-child(2) { animation-delay: 0.25s; }
  .links li:nth-child(3) { animation-delay: 0.35s; }
  .links li:nth-child(4) { animation-delay: 0.45s; }

  .link-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--fg);
    transition: background 0.2s, padding 0.2s;
    border-radius: 4px;
    gap: 12px;
  }

  .links li:first-child .link-item {
    border-top: 1px solid var(--line);
  }

  .link-item:hover {
    background: var(--hover-bg);
    padding-left: 12px;
    padding-right: 12px;
  }

  .link-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .link-label {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--fg);
  }

  .link-desc {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    font-family: 'DM Mono', monospace;
  }

  .link-arrow {
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.2s, color 0.2s;
  }

  .link-item:hover .link-arrow {
    transform: translateX(4px);
    color: var(--fg);
  }

  /* フッター */
  .footer {
    margin-top: 48px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    font-family: 'DM Mono', monospace;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.6s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <p class="site-name">世の中に綿パンが少なくて<br>困る</p>
    <div class="divider"></div>
    <p class="tagline">AI-generated art &amp; illustration</p>
  </header>

  <ul class="links">

    <li>
      <a class="link-item" href="https://myfans.jp/take_a_pt" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-label">myfans</span>
          <span class="link-desc">作品・コンテンツ販売</span>
        </div>
        <span class="link-arrow">→</span>
      </a>
    </li>

    <!-- X（Twitter）追加用 -->
    <!--
    <li>
      <a class="link-item" href="https://twitter.com/YOURHANDLE" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-label">X / Twitter</span>
          <span class="link-desc">新作・お知らせ</span>
        </div>
        <span class="link-arrow">→</span>
      </a>
    </li>
    -->

    <!-- Instagram 追加用 -->
    <!--
    <li>
      <a class="link-item" href="https://instagram.com/YOURHANDLE" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-label">Instagram</span>
          <span class="link-desc">イラスト・画像ギャラリー</span>
        </div>
        <span class="link-arrow">→</span>
      </a>
    </li>
    -->

  </ul>

  <footer class="footer">© 世の中に綿パンが少なくて困る</footer>

</div>
</body>
</html>

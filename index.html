<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世の中に綿パンが少なくて困る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Zen+Kaku+Gothic+New:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0ede6;
    --fg: #1c1a17;
    --muted: #9a9590;
    --line: #d5d0c8;
    --hover: #e8e4dc;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }

  /* 左：画像エリア */
  .image-panel {
    position: relative;
    background: #ddd8d0;
    overflow: hidden;
  }

  .image-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    opacity: 0.5;
  }

  .top-bar {
    position: absolute;
    top: 32px;
    left: 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--fg);
    opacity: 0.6;
  }

  .top-bar-line {
    width: 32px;
    height: 1px;
    background: var(--fg);
    opacity: 0.4;
  }

  /* 右：コンテンツエリア */
  .content-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 56px;
    opacity: 0;
    animation: fadeIn 1s ease 0.3s forwards;
  }

  .site-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(22px, 2.8vw, 32px);
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1.3;
    color: var(--fg);
    margin-bottom: 14px;
  }

  .tagline-ja {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.08em;
    line-height: 1.7;
    margin-bottom: 4px;
  }

  .tagline-en {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.18em;
    line-height: 1.7;
  }

  .divider {
    width: 32px;
    height: 1px;
    background: var(--line);
    margin: 28px 0;
  }

  .links-label {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .links {
    list-style: none;
  }

  .links li {
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }
  .links li:nth-child(1) { animation-delay: 0.5s; }
  .links li:nth-child(2) { animation-delay: 0.65s; }
  .links li:nth-child(3) { animation-delay: 0.8s; }

  .link-item {
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--fg);
    transition: opacity 0.2s;
  }

  .links li:first-child .link-item {
    border-top: 1px solid var(--line);
  }

  .link-item:hover {
    opacity: 0.4;
  }

  .link-num {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }

  .link-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 2vw, 24px);
    font-weight: 300;
    letter-spacing: 0.05em;
    color: var(--fg);
  }

  .footer {
    margin-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeIn 0.5s ease 1s forwards;
  }

  .footer-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .footer-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
  }

  .footer-copy {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 680px) {
    body { grid-template-columns: 1fr; }
    .image-panel { height: 50vh; }
    .content-panel { padding: 48px 32px; }
  }
</style>
</head>
<body>

  <div class="image-panel">
    <div class="top-bar">
      <div class="top-bar-line"></div>
      <span>MEN-PAN / 2026</span>
    </div>
    <img src="hero.png" alt="hero" style="width:100%;height:100%;object-fit:cover;display:block;">
  </div>

  <div class="content-panel">

    <p class="site-name">世の中に綿パンが<br>少なくて困る</p>
    <p class="tagline-ja">綿素材をテーマにした自然なビジュアル / MYFANS限定コンテンツ</p>
    <p class="tagline-en">Cotton-based candid visuals / exclusive content on MYFANS</p>

    <div class="divider"></div>

    <p class="links-label">Links</p>

    <ul class="links">
      <li>
        <a class="link-item" href="https://myfans.jp/take_a_pt" target="_blank" rel="noopener">
          <span class="link-num">01</span>
          <span class="link-label">myfans</span>
        </a>
      </li>
      <!-- X追加用
      <li>
        <a class="link-item" href="https://twitter.com/YOURHANDLE" target="_blank" rel="noopener">
          <span class="link-num">02</span>
          <span class="link-label">X</span>
        </a>
      </li>
      -->
      <!-- Instagram追加用
      <li>
        <a class="link-item" href="https://instagram.com/YOURHANDLE" target="_blank" rel="noopener">
          <span class="link-num">03</span>
          <span class="link-label">Instagram</span>
        </a>
      </li>
      -->
    </ul>

    <footer class="footer">
      <div class="footer-status">
        <div class="footer-dot"></div>
        <span>Now Updating</span>
      </div>
      <span class="footer-copy">© men-pan</span>
    </footer>

  </div>

</body>
</html>
